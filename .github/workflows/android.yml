name: Build Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'frontend/**'
      - 'tools/**'
      - 'launcher/**'
      - 'linux/**'
      - 'tests/**'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Bundle backend into Android app
        run: |
          mkdir -p android/app/src/main/python
          rm -rf android/app/src/main/python/backend
          cp -r backend android/app/src/main/python/
          rm -f android/app/src/main/python/backend/*.db android/app/src/main/python/backend/*.env
          rm -rf android/app/src/main/python/backend/__pycache__ android/app/src/main/python/backend/*/__pycache__

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p android/keystore
            echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
            echo "Keystore successfully decoded"
          else
            echo "KEYSTORE_BASE64 secret is not configured"
          fi

      - name: Build Release APK
        working-directory: ./android
        env:
          KEYSTORE_FILE: keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Sign & Prepare Official APK for Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist/android
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          # Copy signed release APKs according to official naming
          find android/app/build/outputs/apk -type f -name "tatap-*-release-*.apk" -o -name "tatap-release-*.apk" | while read -r apk; do
            echo "Copying $apk to dist/android/"
            cp "$apk" dist/android/
          done
          # Ensure fallback naming if needed
          if [ ! -f "dist/android/tatap-release-${TAG_NAME}.apk" ]; then
            find android/app/build/outputs/apk -type f -name "*mobile*release*.apk" | head -n 1 | xargs -I {} cp {} "dist/android/tatap-release-${TAG_NAME}.apk"
          fi
          if [ ! -f "dist/android/tatap-tv-release-${TAG_NAME}.apk" ]; then
            find android/app/build/outputs/apk -type f -name "*tv*release*.apk" | head -n 1 | xargs -I {} cp {} "dist/android/tatap-tv-release-${TAG_NAME}.apk"
          fi
          echo "Release APKs prepared in dist/android/:"
          ls -lh dist/android/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tatap-Android-Release
          path: android/app/build/outputs/apk/**/release/*.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tatap-Android-Debug
          path: android/app/build/outputs/apk/**/debug/*.apk

      - name: Attach ONLY Official Signed APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/android/tatap-release-*.apk
            dist/android/tatap-tv-release-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

